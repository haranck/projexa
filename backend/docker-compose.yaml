services:
  backend:
    image: haranck/projexa-backend:latest
    # build: .
    ports:
      - "4000:4000"
    environment:
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - app-network

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
